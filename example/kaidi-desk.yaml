substitutions:
  name: kaidi-desk
  friendly_name: Standing Desk

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

packages:
  desk: github://clintval/esphome-kaidi-desk/example/desk.yaml@main

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 8.5dB
  ap:
    password: !secret ap_password

captive_portal:
