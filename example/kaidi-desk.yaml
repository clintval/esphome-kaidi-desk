substitutions:
  name: kaidi-desk
  friendly_name: Standing Desk

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: clintval.esphome-kaidi-desk
    version: "0.1.0"

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

external_components:
  - source: github://clintval/esphome-kaidi-desk@main
    components: [kaidi_desk]

dashboard_import:
  package_import_url: github://clintval/esphome-kaidi-desk/example/kaidi-desk.yaml@main

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:

captive_portal:

uart:
  rx_pin: GPIO4
  tx_pin: GPIO7
  baud_rate: 9600

kaidi_desk:
  tx_enable_pin:
    number: GPIO6
    inverted: true
  wake_pin:
    number: GPIO10
    inverted: true

sensor:
  - platform: kaidi_desk
    height:
      name: Height

text_sensor:
  - platform: kaidi_desk
    status:
      name: Status

number:
  - platform: kaidi_desk
    target_height:
      name: Target Height
      unit_of_measurement: in

button:
  - platform: kaidi_desk
    nudge_up:
      name: Nudge Up
    nudge_down:
      name: Nudge Down
    stop:
      name: Stop
    reset:
      name: Reset

switch:
  - platform: kaidi_desk
    keep_awake:
      name: Keep Awake
