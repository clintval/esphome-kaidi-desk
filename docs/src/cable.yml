metadata:
  title: Kaidi desk dongle, rev 4 cabling

options:
  bgcolor: WH
  bgcolor_node: WH
  bgcolor_connector: WH
  bgcolor_cable: WH
  bgcolor_bundle: WH
  fontname: Helvetica

connectors:
  BOX:
    type: RJ50 plug
    subtype: 10P10C, into the control box
    pinlabels: [NC, +5V, GND, NC, NC, NC, CMD, HEIGHT, NC, WAKE]
    hide_disconnected_pins: true
  DONGLE_BOX:
    type: Dongle box side
    subtype: solder pads
    pinlabels: [+5V, GND, CMD, HEIGHT, WAKE]
  KEYPAD:
    type: RJ50 jack
    subtype: 10P10C breakout, keypad plugs in
    pinlabels: [NC, +5V, GND, NC, NC, NC, CMD, HEIGHT, NC, WAKE]
    hide_disconnected_pins: true
  DONGLE_KEYPAD:
    type: Dongle keypad side
    subtype: solder pads
    pinlabels: [+5V, GND, CMD, HEIGHT, WAKE]

cables:
  W1:
    type: Cut RJ50 cable
    gauge: 28 AWG
    length: 0.3
    color_code: DIN
    wirecount: 5
    notes: Beep out each color against the plug before soldering
  W2:
    type: Dupont jumpers
    wirecount: 5
    colors: [RD, BK, BU, GN, PK]

connections:
  - - BOX: [2, 3, 7, 8, 10]
    - W1: [1-5]
    - DONGLE_BOX: [1-5]
  - - KEYPAD: [2, 3, 7, 8, 10]
    - W2: [1-5]
    - DONGLE_KEYPAD: [1-5]
