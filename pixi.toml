[workspace]
authors = ["clintval <valentine.clint@gmail.com>"]
channels = ["conda-forge"]
name = "esphome-kaidi-desk"
platforms = ["linux-64", "osx-64", "osx-arm64"]
version = "0.1.0"

[tasks]
fmt = "ruff format"
fmt-check = "ruff format --check"
lint = "ruff check"
kicad-tools = { cmd = "test -f $KICAD_SITE/pcbdraw/__init__.py || $KICAD_PYTHON -m pip install --quiet --disable-pip-version-check --target $KICAD_SITE pcbdraw==1.3.0", description = "Install PcbDraw for KiCad's Python" }
freerouting = { cmd = "python scripts/fetch_freerouting.py $FREEROUTING", description = "Download the pinned Freerouting autorouter" }

schematic = { cmd = "python scripts/make_schematic.py hardware/kaidi-desk.kicad_sch && python scripts/render_schematic.py", description = "Write the schematic and render it" }
footprints = { cmd = "python scripts/make_footprints.py hardware/kaidi.pretty && python scripts/make_models.py hardware/kaidi.3dshapes", description = "Write custom footprints and 3D models" }
pcb = { cmd = "$KICAD_PYTHON scripts/make_pcb.py hardware/kaidi-desk.kicad_sch hardware/kaidi-desk.kicad_pcb && $KICAD_PYTHON scripts/route_pcb.py hardware/kaidi-desk.kicad_pcb $FREEROUTING $JAVA_HOME/bin/java", depends-on = ["schematic", "footprints", "freerouting"], description = "Place and autoroute the PCB" }
fab = { cmd = "python scripts/check_hardware.py && python scripts/export_fab.py", depends-on = ["pcb"], description = "Check the design, then export the Gerbers, parts list and positions" }
enclosure = { cmd = "python scripts/make_enclosure.py hardware", depends-on = ["pcb"], description = "Build the 3D-printable box" }
glb = { cmd = "mkdir -p .build && $KICAD_CLI pcb export glb -f --user-origin 100x100mm --include-tracks --include-pads --include-zones --include-silkscreen --include-soldermask -o .build/board.glb hardware/kaidi-desk.kicad_pcb", depends-on = ["pcb"], description = "Export the board for rendering" }
protoboard = { cmd = "python scripts/protoboard.py && python scripts/render_protoboard.py", depends-on = ["kicad-tools"], description = "Check and draw the protoboard build" }
hardware = { depends-on = ["fab", { task = "renders", environment = "render" }, "protoboard"], description = "Regenerate the whole hardware design" }
check = { cmd = "python scripts/check_hardware.py", description = "Run ERC, DRC, parity, netlist and protoboard checks" }

compile = { cmd = "mkdir -p .build && printf 'wifi_ssid: \"ssid\"\\nwifi_password: \"password1\"\\nap_password: \"password1\"\\napi_encryption_key: \"MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=\"\\n' > .build/secrets.yaml && sed 's#source: github://clintval/esphome-kaidi-desk@main#source: {type: local, path: ../components}#' example/desk.yaml > .build/desk.yaml && sed 's#desk: github://clintval/esphome-kaidi-desk/example/desk.yaml@main#desk: !include desk.yaml#' example/kaidi-desk.yaml > .build/kaidi-desk.yaml && esphome compile .build/kaidi-desk.yaml", description = "Compile the example firmware" }
site = { cmd = "python scripts/make_site.py {{ version }} .build/site", args = [{ arg = "version", default = "0.1.0" }], description = "Compile the prebuilt firmware and build the browser installer" }

[feature.render.tasks]
renders = { cmd = "python scripts/render_blender.py .build/board.glb hardware/enclosure docs", depends-on = [
  { task = "glb", environment = "default" },
  { task = "enclosure", environment = "default" },
], description = "Render the board and its box" }

[feature.render.dependencies]
python = "3.11.*"

[feature.render.pypi-dependencies]
bpy = "==4.5.4"

[environments]
render = { features = ["render"], no-default-feature = true }

[dependencies]
openjdk = ">=25"
python = "3.12.*"
ruff = ">=0.17.3,<0.18"

[pypi-dependencies]
build123d = "==0.13.0"
esphome = "==2026.9.1"

[activation.env]
KICAD_SITE = "$PIXI_PROJECT_ROOT/.pixi/kicad-site"
FREEROUTING = "$PIXI_PROJECT_ROOT/.pixi/tools/freerouting-2.5.0.jar"

[target.osx-arm64.activation.env]
KICAD_CLI = "/Applications/KiCad/KiCad.app/Contents/MacOS/kicad-cli"
KICAD_PYTHON = "/Applications/KiCad/KiCad.app/Contents/Frameworks/Python.framework/Versions/Current/bin/python3"
KICAD_SHARE = "/Applications/KiCad/KiCad.app/Contents/SharedSupport"
KICAD_CONFIG = "$HOME/Library/Preferences/kicad/10.0"

[target.osx-64.activation.env]
KICAD_CLI = "/Applications/KiCad/KiCad.app/Contents/MacOS/kicad-cli"
KICAD_PYTHON = "/Applications/KiCad/KiCad.app/Contents/Frameworks/Python.framework/Versions/Current/bin/python3"
KICAD_SHARE = "/Applications/KiCad/KiCad.app/Contents/SharedSupport"
KICAD_CONFIG = "$HOME/Library/Preferences/kicad/10.0"

[target.linux-64.activation.env]
KICAD_CLI = "/usr/bin/kicad-cli"
KICAD_PYTHON = "/usr/bin/python3"
KICAD_SHARE = "/usr/share/kicad"
KICAD_CONFIG = "$HOME/.config/kicad/10.0"
